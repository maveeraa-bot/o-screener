    <script>
      // Suppress platform-expected benign Vite HMR websocket logs in AI Studio preview iframe
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason) {
          const msg = event.reason.message || String(event.reason);
          if (msg.includes('WebSocket') || msg.includes('websocket')) {
            event.preventDefault();
          }
        }
      });
      const _origError = console.error;
      console.error = function(...args) {
        const firstArg = args[0] ? String(args[0]) : '';
        if (firstArg.includes('[vite] failed to connect to websocket') || firstArg.includes('WebSocket closed without opened')) {
          return;
        }
        _origError.apply(console, args);
      };
    </script>
